<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor Sequencial NF-e</title>
  
  <!-- Tesseract OCR -->
  <script src="https://unpkg.com/tesseract.js@v5.0.2/dist/tesseract.min.js"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #1c1e21;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: #fff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      text-align: center;
      box-sizing: border-box;
    }
    h2 { margin-top: 0; color: #007aff; }
    p.instrucao { font-size: 14px; color: #606770; margin-bottom: 20px; }

    .btn-camera-label {
      display: inline-block;
      padding: 16px 32px;
      background-color: #007aff;
      color: white;
      font-weight: 600;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,122,255,0.3);
    }

    #previewContainer {
      margin-top: 20px;
      display: none;
      position: relative;
    }
    #canvasCrop {
      max-width: 100%;
      border-radius: 12px;
      border: 2px solid #007aff;
    }
    #loadingOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.85);
      border-radius: 12px;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #007aff;
    }

    .result-box {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 12px;
      border: 1px solid #e1e4e8;
      display: none;
      word-break: break-all;
    }
    .status-text { font-size: 14px; font-weight: bold; margin-bottom: 10px; }
    .status-success { color: #28a745; }
    .status-fail { color: #dc3545; }
    
    #chaveDisplay {
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      font-weight: bold;
      background: #e9ecef;
      padding: 12px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    .btn-action {
      display: block;
      width: 100%;
      padding: 15px 0;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 10px;
      border: none;
      cursor: pointer;
    }
    .btn-whatsapp { background-color: #25D366; }
    .btn-meudanfe { background-color: #0d6efd; }
    .btn-reset { background-color: #6c757d; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Leitor de Chave NF-e</h2>
  <p class="instrucao">Fotografe centralizando <strong>apenas a linha de 44 números da Chave de Acesso</strong>.</p>

  <label for="fileInput" class="btn-camera-label">
    📸 Fotografar Chave
  </label>
  <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;" onchange="processarFotoSequencial(event)">

  <!-- Área onde mostramos o recorte processado -->
  <div id="previewContainer">
    <p style="font-size:12px; color:#666; margin-bottom: 5px;">Área recortada para análise:</p>
    <canvas id="canvasCrop"></canvas>
    <div id="loadingOverlay">⏳ Lendo da esquerda para a direita...</div>
  </div>

  <div id="resultBox" class="result-box">
    <div id="statusLabel" class="status-text"></div>
    <div id="chaveDisplay"></div>

    <div id="actionButtons" style="display: none;">
      <a id="btnZap" class="btn-action btn-whatsapp" target="_blank">Enviar via WhatsApp</a>
      <a id="btnMeuDanfe" class="btn-action btn-meudanfe" target="_blank">Baixar XML no MeuDanfe</a>
    </div>
    
    <button onclick="reiniciar()" class="btn-action btn-reset">Tirar Nova Foto</button>
  </div>
</div>

<script>
  let worker = null;

  async function iniciarWorker() {
    if (!worker) {
      worker = await Tesseract.createWorker('eng'); // Inglês é mais rápido e preciso para apenas números
    }
  }
  iniciarWorker();

  async function processarFotoSequencial(event) {
    const file = event.target.files[0];
    if (!file) return;

    document.getElementById('previewContainer').style.display = 'block';
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.getElementById('resultBox').style.display = 'none';

    // 1. Carrega a imagem original num elemento Image
    const img = new Image();
    img.src = URL.createObjectURL(file);

    img.onload = async () => {
      // 2. Faz o RECORTE AUTOMÁTICO na área central da imagem (focado onde fica a chave)
      const canvas = document.getElementById('canvasCrop');
      const ctx = canvas.getContext('2d');

      // Definimos o recorte pegando 90% da largura e 35% da altura central
      const cropX = img.width * 0.05;
      const cropY = img.height * 0.35; // Foco na faixa central da folha
      const cropWidth = img.width * 0.90;
      const cropHeight = img.height * 0.30;

      canvas.width = cropWidth;
      canvas.height = cropHeight;

      // Desenha apenas essa região no canvas
      ctx.drawImage(img, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

      try {
        await iniciarWorker();

        // 3. Configura o OCR para reconhecer APENAS NÚMEROS e na orientação horizontal normal (Left to Right)
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789', // Força ler apenas dígitos
          tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE // Força o leitor a tratar como UMA LINHA ÚNICA da esq. para dir.
        });

        // Executa a leitura no canvas recortado
        const { data: { text } } = await worker.recognize(canvas);

        // Remove qualquer caractere invisível ou espaço
        const apenasNumeros = text.replace(/\D/g, '');

        document.getElementById('loadingOverlay').style.display = 'none';
        document.getElementById('resultBox').style.display = 'block';

        const statusLabel = document.getElementById('statusLabel');
        const chaveDisplay = document.getElementById('chaveDisplay');

        // Se encontrar uma sequência exata ou aproximada
        if (apenasNumeros.length === 44) {
          statusLabel.innerText = "✅ Leitura Perfeita! (44 Dígitos)";
          statusLabel.className = "status-text status-success";
          chaveDisplay.innerText = apenasNumeros;
          configurarBotoes(apenasNumeros);
        } else if (apenasNumeros.length > 35 && apenasNumeros.length < 44) {
          // Se ler quase tudo, avisa o usuário qual parte faltou
          statusLabel.innerText = `⚠️ Leitura Incompleta (${apenasNumeros.length}/44 dígitos).`;
          statusLabel.className = "status-text status-fail";
          chaveDisplay.innerText = apenasNumeros + "\n\n(Aproxime um pouco mais a foto da linha da chave)";
        } else {
          // Tenta extrair qualquer padrão de 44 números se a string total ficou maior
          const match = apenasNumeros.match(/\d{44}/);
          if (match) {
            statusLabel.innerText = "✅ Chave Extraída Sequencialmente!";
            statusLabel.className = "status-text status-success";
            chaveDisplay.innerText = match[0];
            configurarBotoes(match[0]);
          } else {
            statusLabel.innerText = `❌ Falha na leitura sequencial (${apenasNumeros.length} números identificados).`;
            statusLabel.className = "status-text status-fail";
            chaveDisplay.innerText = apenasNumeros.length > 0 ? apenasNumeros : "Nenhum número nítido encontrado.";
          }
        }

      } catch (err) {
        console.error(err);
        document.getElementById('loadingOverlay').style.display = 'none';
        alert("Erro ao processar imagem.");
      }
    };
  }

  function configurarBotoes(chave) {
    document.getElementById('actionButtons').style.display = 'block';
    const urlMeuDanfe = `https://meudanfe.com.br/danfe/${chave}`;
    document.getElementById('btnMeuDanfe').href = urlMeuDanfe;
    
    const mensagemZap = `Olá! Segue a chave da Nota Fiscal para baixar o XML:\n\n*Chave:* ${chave}\n\n*Link direto no MeuDanfe:*\n${urlMeuDanfe}`;
    document.getElementById('btnZap').href = `https://wa.me/?text=${encodeURIComponent(mensagemZap)}`;
  }

  function reiniciar() {
    document.getElementById('fileInput').value = "";
    document.getElementById('previewContainer').style.display = 'none';
    document.getElementById('resultBox').style.display = 'none';
  }
</script>

</body>
</html>
