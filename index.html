<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor OCR de NF-e</title>
  
  <!-- Biblioteca Tesseract.js para OCR direto no navegador -->
  <script src="https://unpkg.com/tesseract.js@v5.0.2/dist/tesseract.min.js"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #1c1e21;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: #fff;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      text-align: center;
      box-sizing: border-box;
    }
    h2 { margin-top: 0; color: #007aff; }
    p.instrucao { font-size: 15px; color: #606770; margin-bottom: 20px; }

    /* Botão de foto estilizado como iOS */
    .btn-camera-label {
      display: inline-block;
      padding: 16px 32px;
      background-color: #007aff;
      color: white;
      font-weight: 600;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
      box-shadow: 0 4px 12px rgba(0,122,255,0.3);
    }
    .btn-camera-label:active { background-color: #0056b3; }

    /* Área de Preview e Processamento */
    #previewContainer {
      margin-top: 20px;
      display: none;
      position: relative;
    }
    #imagePreview {
      max-width: 100%;
      max-height: 250px;
      border-radius: 12px;
      border: 2px solid #ddd;
    }
    #loadingOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.8);
      border-radius: 12px;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #007aff;
    }

    /* Caixa de Resultado */
    .result-box {
      margin-top: 25px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 12px;
      border: 1px solid #e1e4e8;
      display: none;
      word-break: break-all;
    }
    .status-text { font-size: 14px; font-weight: bold; margin-bottom: 10px; }
    .status-success { color: #28a745; }
    .status-fail { color: #dc3545; }
    
    #chaveDisplay {
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      font-weight: bold;
      background: #e9ecef;
      padding: 10px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    /* Botões de Ação */
    .btn-action {
      display: block;
      width: 100%;
      padding: 15px 0;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 12px;
      border: none;
      cursor: pointer;
    }
    .btn-whatsapp { background-color: #25D366; }
    .btn-meudanfe { background-color: #0d6efd; }
    .btn-reset { background-color: #6c757d; margin-top: 20px; }

  </style>
</head>
<body>

<div class="container">
  <h2>Leitor OCR de NF-e</h2>
  <p class="instrucao">Tire uma foto que mostre claramente o texto "CHAVE DE ACESSO" e os números abaixo dela.</p>

  <!-- Botão Nativo que aciona a câmera no iOS -->
  <label for="fileInput" class="btn-camera-label">
    📸 Tirar Foto da Chave
  </label>
  <!-- capture="environment" sugere o uso da câmera traseira -->
  <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;" onchange="processarImagemComOCR(event)">

  <!-- Container de Preview -->
  <div id="previewContainer">
    <img id="imagePreview" alt="Preview">
    <div id="loadingOverlay">⏳ Lendo texto...</div>
  </div>

  <!-- Área de Resultados -->
  <div id="resultBox" class="result-box">
    <div id="statusLabel" class="status-text"></div>
    <div id="chaveDisplay"></div>

    <div id="actionButtons" style="display: none;">
      <a id="btnZap" class="btn-action btn-whatsapp" target="_blank">Enviar via WhatsApp</a>
      <a id="btnMeuDanfe" class="btn-action btn-meudanfe" target="_blank">Baixar XML no MeuDanfe</a>
    </div>
    
    <button onclick="reiniciar()" class="btn-action btn-reset">Tirar Nova Foto</button>
  </div>
</div>

<script>
  // Inicializa o Worker do Tesseract.js (português)
  // Isso pode demorar alguns segundos no primeiro carregamento
  let worker = null;
  async function carregarWorker() {
    if (!worker) {
      worker = await Tesseract.createWorker('por'); // 'por' para Português
    }
  }
  carregarWorker(); // Pré-carrega

  async function processarImagemComOCR(event) {
    const file = event.target.files[0];
    if (!file) return;

    // UI: Mostrar Preview e Loading
    const preview = document.getElementById('imagePreview');
    preview.src = URL.createObjectURL(file);
    document.getElementById('previewContainer').style.display = 'block';
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('actionButtons').style.display = 'none';

    try {
      await carregarWorker(); // Garante que está carregado
      
      // Executa o reconhecimento de texto na imagem
      const { data: { text } } = await worker.recognize(file);
      
      console.log("Texto extraído:", text); // Para debug

      // Limpa o texto: mantém apenas números
      const apenasNumeros = text.replace(/\D/g, '');
      console.log("Números extraídos:", apenasNumeros);

      // Tenta encontrar uma sequência de 44 dígitos dentro do texto extraído
      // Isso é mais robusto do que pegar tudo, caso haja outros números na NF
      const matchChave = apenasNumeros.match(/\d{44}/);
      
      document.getElementById('loadingOverlay').style.display = 'none';
      document.getElementById('resultBox').style.display = 'block';
      const statusLabel = document.getElementById('statusLabel');
      const chaveDisplay = document.getElementById('chaveDisplay');

      if (matchChave) {
        // SUCESSO: Encontrou os 44 dígitos
        const chaveFinal = matchChave[0];
        
        statusLabel.innerText = "✅ Chave de Acesso lida com sucesso!";
        statusLabel.className = "status-text status-success";
        
        // Formata a chave em blocos de 4 para facilitar a leitura humana (opcional)
        chaveDisplay.innerText = chaveFinal.replace(/(\d{4})/g, '$1 ').trim();
        
        configurarBotoesAcao(chaveFinal);
      } else {
        // FALHA: Não encontrou 44 dígitos seguidos
        statusLabel.innerText = "❌ Não foi possível ler a chave de 44 dígitos.";
        statusLabel.className = "status-text status-fail";
        
        if (apenasNumeros.length > 0) {
            chaveDisplay.innerText = `Lidos ${apenasNumeros.length} dígitos esparsos. Texto muito sujo ou desfocado.`;
        } else {
            chaveDisplay.innerText = "Nenhum número detectado. Tente focar melhor no texto.";
        }
      }

    } catch (error) {
      console.error("Erro no OCR:", error);
      document.getElementById('loadingOverlay').style.display = 'none';
      alert("Ocorreu um erro ao processar a imagem.");
    }
  }

  function configurarBotoesAcao(chave) {
    document.getElementById('actionButtons').style.display = 'block';
    
    // Configura o link do MeuDanfe
    const urlMeuDanfe = `https://meudanfe.com.br/danfe/${chave}`;
    document.getElementById('btnMeuDanfe').href = urlMeuDanfe;
    
    // Configura a mensagem do WhatsApp
    const mensagemZap = `Olá! Segue a chave da Nota Fiscal para baixar o XML:\n\n*Chave:* ${chave}\n\n*Link direto no MeuDanfe:*\n${urlMeuDanfe}`;
    document.getElementById('btnZap').href = `https://wa.me/?text=${encodeURIComponent(mensagemZap)}`;
  }

  function reiniciar() {
    document.getElementById('fileInput').value = "";
    document.getElementById('previewContainer').style.display = 'none';
    document.getElementById('resultBox').style.display = 'none';
  }
</script>

</body>
</html>
